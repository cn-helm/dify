name: Helm Chart
on:
  push:
    paths: [dify/**, .github/workflows/chart.yaml]
  pull_request:
    paths: [dify/**, .github/workflows/chart.yaml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes: [1.26.15, 1.31.0, 1.34.0]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Kubernetes schema validator
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp kubeconform
          mkdir -p /tmp/dify-schema-cache
      - run: helm lint dify
      - run: ruby dify/tests/validate.rb
        env:
          KUBECONFORM: /tmp/kubeconform
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
      - name: Package
        run: helm package dify --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dify-chart-k8s-${{ matrix.kubernetes }}
          path: dist/*.tgz
