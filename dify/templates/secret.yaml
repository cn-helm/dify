{{- if not .Values.security.existingSecret }}
{{- $name := include "dify.secret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and .Release.IsUpgrade (not $existing) }}
{{- fail "Managed Secret is missing during upgrade; restore it or supply security.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels: {{ include "dify.labels" . | nindent 4 }}
type: Opaque
data:
{{- $keys := list "SECRET_KEY" "DB_PASSWORD" "REDIS_PASSWORD" "WEAVIATE_API_KEY" "VECTOR_STORE_PASSWORD" "CODE_EXECUTION_API_KEY" "PLUGIN_DAEMON_KEY" "INNER_API_KEY_FOR_PLUGIN" "AGENT_BACKEND_API_TOKEN" "DIFY_AGENT_SERVER_SECRET_KEY" "SHELLCTL_AUTH_TOKEN" }}
{{- range $key := $keys }}
{{- if $existing }}
  {{ $key }}: {{ required (printf "Existing Secret is missing %s" $key) (index $existing.data $key) | quote }}
{{- else if eq $key "DIFY_AGENT_SERVER_SECRET_KEY" }}
  {{ $key }}: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | trimSuffix "=" | b64enc | quote }}
{{- else if eq $key "VECTOR_STORE_PASSWORD" }}
  {{ $key }}: {{ printf "Dify!%s" (randAlphaNum 40) | b64enc | quote }}
{{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}