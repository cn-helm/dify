{{- $name := include "dify.name" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      client_max_body_size 100m;
      {{- range .Values.exposure.trustedProxyCidrs }}
      set_real_ip_from {{ . }};
      {{- end }}
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto {{ ternary "https" "$scheme" (and (eq .Values.exposure.type "Ingress") .Values.exposure.tls.enabled) }};
      proxy_set_header X-Forwarded-Port {{ ternary "443" "$server_port" (and (eq .Values.exposure.type "Ingress") .Values.exposure.tls.enabled) }};
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      location = /healthz { access_log off; return 200 'ok'; }
      location ~ ^/(console/api|api|v1|openapi|files|mcp|triggers)(/|$) {
        proxy_pass http://{{ $name }}-api:5001;
      }
      {{- if .Values.collaboration.enabled }}
      location /socket.io/ {
        proxy_pass http://{{ $name }}-websocket:5006;
        include /etc/nginx/dify-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
      }
      {{- end }}
      location /e/ {
        proxy_pass http://{{ $name }}-plugin:5002;
        include /etc/nginx/dify-headers.conf;
        proxy_set_header Connection "";
        proxy_set_header Dify-Hook-Url {{ ternary "https" "$scheme" (and (eq .Values.exposure.type "Ingress") .Values.exposure.tls.enabled) }}://$host$request_uri;
      }
      location / { proxy_pass http://{{ $name }}-web:3000; }
    }
  headers.conf: |
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto {{ ternary "https" "$scheme" (and (eq .Values.exposure.type "Ingress") .Values.exposure.tls.enabled) }};
    proxy_set_header X-Forwarded-Port {{ ternary "443" "$server_port" (and (eq .Values.exposure.type "Ingress") .Values.exposure.tls.enabled) }};
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-nginx
spec:
  type: {{ ternary "ClusterIP" .Values.exposure.type (eq .Values.exposure.type "Ingress") }}
  selector:
    {{- include "dify.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dify.labels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "dify.labels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
      annotations:
        checksum/nginx: {{ printf "%s-%v" (toJson .Values.exposure) .Values.collaboration.enabled | sha256sum }}
    spec:
      {{- include "dify.pod" . | nindent 6 }}
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: config
              mountPath: /etc/nginx/dify-headers.conf
              subPath: headers.conf
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-nginx
{{- if eq .Values.exposure.type "Ingress" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- with .Values.exposure.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.exposure.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.exposure.tls.enabled }}
  tls:
    - hosts: [{{ .Values.exposure.host | quote }}]
      secretName: {{ .Values.exposure.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.exposure.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-nginx
                port:
                  number: 80
{{- end }}